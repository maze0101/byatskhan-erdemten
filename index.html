function rng(seed) {
  let s = seed * 9301 + 49297;
  return () => (s = (s * 9301 + 49297) % 233280) / 233280;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeRound() {
  const item = GAME_ITEMS[Math.floor(Math.random() * GAME_ITEMS.length)];
  const distractors = shuffle(GAME_ITEMS.filter((g) => g.letter !== item.letter)).slice(0, 2);
  const options = shuffle([item, ...distractors]);
  return { item, options };
}

/* ---------- 3D "chunky button" style helper ---------- */

function shade(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  const amt = Math.round(2.55 * percent);
  let r = (num >> 16) + amt;
  let g = ((num >> 8) & 0x00ff) + amt;
  let b = (num & 0x0000ff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

function depthStyle(base, offset = 6) {
  return {
    background: `linear-gradient(180deg, ${shade(base, 22)} 0%, ${base} 55%, ${shade(base, -10)} 100%)`,
    border: `2px solid ${shade(base, -22)}`,
    boxShadow: `0 ${offset}px 0 ${shade(base, -38)}, 0 ${offset + 6}px ${offset + 10}px rgba(0,0,0,0.22), inset 0 0 0 2px rgba(255,201,60,0.45)`,
    "--shadow": shade(base, -38),
  };
}

  function startMemoryGame() {
    const picks = shuffle(GAME_ITEMS).slice(0, 6);
    const deck = shuffle(
      picks.flatMap((item, i) => [
        { id: `${i}-a`, key: item.letter, emoji: item.emoji, flipped: false, matched: false },
        { id: `${i}-b`, key: item.letter, emoji: item.emoji, flipped: false, matched: false },
      ])
    );
    setMemoryCards(deck);
    setMemoryFirstPick(null);
    setMemoryLock(false);
    setMemoryMoves(0);
    setCaption("Хос ол! 🧠");
    setScreen("game-memory");
  }

  function flipMemoryCard(index) {
    if (memoryLock) return;
    const card = memoryCards[index];
    if (!card || card.flipped || card.matched) return;

    const next = memoryCards.map((c, i) => (i === index ? { ...c, flipped: true } : c));
    setMemoryCards(next);

    if (memoryFirstPick === null) {
      setMemoryFirstPick(index);
      return;
    }

    setMemoryMoves((m) => m + 1);
    const first = next[memoryFirstPick];
    if (first.key === card.key) {
      setMemoryCards((prev) =>
        prev.map((c, i) => (i === memoryFirstPick || i === index ? { ...c, matched: true } : c))
      );
      setMemoryFirstPick(null);
      bumpMascot();
      setCaption("Хос олдлоо! 🎉");
    } else {
      setMemoryLock(true);
      setCaption("Дахин оролдоорой 💪");
      setTimeout(() => {
        setMemoryCards((prev) =>
          prev.map((c, i) => (i === memoryFirstPick || i === index ? { ...c, flipped: false } : c))
        );
        setMemoryFirstPick(null);
        setMemoryLock(false);
      }, 800);
    }
  }

  function startCountingGame() {
    setCountingTarget(1 + Math.floor(Math.random() * 10));
    setCountingCount(0);
    setCountingScore(0);
    setCountingFeedback(null);
    setCaption("Тоогоо дараад тоол! 👆");
    setScreen("game-counting");
  }

  function tapCounting() {
    if (countingFeedback) return;
    setCountingCount((c) => c + 1);
  }

  function resetCounting() {
    setCountingCount(0);
    setCountingFeedback(null);
  }

  useEffect(() => {
    if (screen !== "game-counting" || countingCount === 0) return;
    if (countingCount === countingTarget) {
      setCountingFeedback("correct");
      setCountingScore((s) => s + 1);
      bumpMascot();
      setCaption(`Зөв! ${countingTarget} 🎉`);
      const t = setTimeout(() => {
        setCountingTarget(1 + Math.floor(Math.random() * 10));
        setCountingCount(0);
        setCountingFeedback(null);
        setCaption("Тоогоо дараад тоол! 👆");
      }, 1000);
      return () => clearTimeout(t);
    }
    if (countingCount > countingTarget) {
      setCountingFeedback("wrong");
      setCaption("Хэтэрлээ, дахин эхэл 💪");
      const t = setTimeout(() => {
        setCountingCount(0);
        setCountingFeedback(null);
      }, 600);
      return () => clearTimeout(t);
    }
  }, [countingCount, screen]);

  function ensureAudioCtx() {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  }

  function playTone(ctx, freq, startTime, dur) {
    if (!freq) return; // rest
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(10.5, startTime + 0.08);
    gain.gain.linearRampToValueAtTime(0, startTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
  }

  function scheduleLullabyLoop() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const sequence = LULLABIES[activeLullabyRef.current].notes;
    let t = ctx.currentTime + 0.15;
    let total = 0;
    sequence.forEach(({ note, dur }) => {
      playTone(ctx, note ? NOTE_FREQ[note] : null, t, dur * 0.9);
      t += dur;
      total += dur;
    });
    lullabyTimeoutRef.current = setTimeout(() => {
      if (lullabyPlayingRef.current) scheduleLullabyLoop();
    }, total * 1000);
  }

  function startShush() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1100;
    filter.Q.value = 0.6;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.6);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();

    noiseSourceRef.current = source;
    noiseGainRef.current = gain;
  }

  function thump(ctx, startTime, freq, dur, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, startTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.6, 30), startTime + dur);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.02);
  }

  function scheduleHeartbeatLoop() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    let t = ctx.currentTime + 0.1;
    const cycle = 0.8;
    const beatsPerBatch = 6;
    for (let i = 0; i < beatsPerBatch; i++) {
      thump(ctx, t, 90, 0.15, 0.5);
      thump(ctx, t + 0.18, 68, 0.15, 0.4);
      t += cycle;
    }
    const total = cycle * beatsPerBatch;
    lullabyTimeoutRef.current = setTimeout(() => {
      if (lullabyPlayingRef.current) scheduleHeartbeatLoop();
    }, total * 1000);
  }

  function startAudioFile(src) {
    const audio = new Audio(encodeURI(src));
    audio.loop = true;
    audio.volume = 0.8;
    audio.play().catch(() => {});
    audioFileRef.current = audio;
  }

  function setLullabySleepTimer(minutes) {
    if (sleepTimeoutRef.current) {
      clearTimeout(sleepTimeoutRef.current);
      sleepTimeoutRef.current = null;
    }
    if (sleepTickRef.current) {
      clearInterval(sleepTickRef.current);
      sleepTickRef.current = null;
    }
    setSleepMinutes(minutes);
    if (minutes) {
      const endsAt = Date.now() + minutes * 60 * 1000;
      sleepEndsAtRef.current = endsAt;
      setSleepRemainingSec(minutes * 60);
      sleepTickRef.current = setInterval(() => {
        setSleepRemainingSec(Math.max(0, Math.round((sleepEndsAtRef.current - Date.now()) / 1000)));
      }, 1000);
      sleepTimeoutRef.current = setTimeout(() => {
        sleepTimeoutRef.current = null;
        stopLullaby();
        setCaption("Тайван нойрсоорой... 💤");
      }, minutes * 60 * 1000);
    } else {
      sleepEndsAtRef.current = null;
      setSleepRemainingSec(0);
    }
  }

  function stopLullaby() {
    lullabyPlayingRef.current = false;
    setIsPlayingLullaby(false);
    if (sleepTimeoutRef.current) {
      clearTimeout(sleepTimeoutRef.current);
      sleepTimeoutRef.current = null;
    }
    if (sleepTickRef.current) {
      clearInterval(sleepTickRef.current);
      sleepTickRef.current = null;
    }
    sleepEndsAtRef.current = null;
    setSleepMinutes(null);
    setSleepRemainingSec(0);
    if (lullabyTimeoutRef.current) clearTimeout(lullabyTimeoutRef.current);
    if (audioFileRef.current) {
      audioFileRef.current.pause();
      audioFileRef.current.currentTime = 0;
      audioFileRef.current = null;
    }
    if (noiseSourceRef.current) {
      try {
        const ctx = audioCtxRef.current;
        if (noiseGainRef.current && ctx) {
          noiseGainRef.current.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
        }
        noiseSourceRef.current.stop(ctx ? ctx.currentTime + 0.2 : undefined);
      } catch (e) {
        /* already stopped */
      }
      noiseSourceRef.current = null;
      noiseGainRef.current = null;
    }
    if (audioCtxRef.current) audioCtxRef.current.suspend();
  }

  function selectLullaby(key) {
    if (activeLullabyRef.current === key && lullabyPlayingRef.current) {
      stopLullaby();
      setCaption("Ая зогслоо");
      return;
    }
    stopLullaby();
    activeLullabyRef.current = key;
    setActiveLullaby(key);
    lullabyPlayingRef.current = true;
    setIsPlayingLullaby(true);
    const item = LULLABIES[key];
    if (item.type === "audio") {
      startAudioFile(item.src);
    } else if (item.type === "noise" && item.mode === "shush") {
      startShush();
    } else if (item.type === "noise" && item.mode === "heartbeat") {
      scheduleHeartbeatLoop();
    } else {
      scheduleLullabyLoop();
    }
    setCaption(`${item.label} эгшиглэж байна... 💤`);
  }

const LULLABY_CIRC = 245.04;

function formatClock(totalSec) {
  const sec = Math.max(0, totalSec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function LullabyPage({ item, idx, playing, profile }) {
  const [notes, setNotes] = useState([]);
  const stars = React.useMemo(() => {
    const r = rng(idx + 3);
    const arr = [];
    for (let k = 0; k < 22; k++) {
      arr.push({ left: r() * 100, top: r() * 60, size: 1 + r() * 2.2, delay: r() * 2.6, dur: 2 + r() * 2.4 });
    }
    return arr;
  }, [idx]);

  useEffect(() => {
    if (!playing || item.type !== "audio") {
      setNotes([]);
      return;
    }
    const id = setInterval(() => {
      setNotes((prev) => [
        ...prev.slice(-5),
        {
          id: Math.random(),
          left: 28 + Math.random() * 44,
          dx: ((Math.random() - 0.5) * 90).toFixed(0),
          glyph: Math.random() > 0.5 ? "♪" : "♫",

    return () => clearInterval(id);

  return (
    <div
      style={{
        position: "relative",
        flex: "0 0 100%",
        height: "100%",
        scrollSnapAlign: "start",
        scrollSnapStop: "always",

        alignItems: "center",
        justifyContent: "center",
        background: `radial-gradient(90% 60% at 50% 62%, ${item.sky[1]}, transparent 72%), linear-gradient(180deg, ${item.sky[0]}, color-mix(in srgb, ${item.sky[0]} 70%, #000))`,

      {stars.map((s, i) => (
        <span
          key={i}
          style={{
            position: "absolute",
            left: s.left + "%",
            top: s.top + "%",
            width: s.size,
            height: s.size,
            borderRadius: "50%",
            background: "#F3E9C7",
            boxShadow: s.size > 2.4 ? "0 0 6px rgba(243,233,199,0.8)" : "none",
            animation: `twinkle ${s.dur}s ease-in-out ${s.delay}s infinite`,
          }}
        />
      ))}

      <svg
        viewBox="0 0 40 40"
        aria-hidden="true"
        style={{
          position: "absolute",
          top: "7%",
          right: "10%",
          width: "17%",
          height: "17%",
          zIndex: 1,
          filter: playing
            ? "drop-shadow(0 0 16px rgba(243,233,199,0.6))"
            : "drop-shadow(0 0 8px rgba(243,233,199,0.32))",

        <defs>

function LullabyScreen({ isPlaying, activeLullaby, onSelect, profile, sleepMinutes, sleepRemainingSec, onSetSleepTimer, playProgress, onBack }) {
  const entries = Object.entries(LULLABIES);
  const [page, setPage] = useState(() => Math.max(0, entries.findIndex(([k]) => k === activeLullaby)));
  const [showTimer, setShowTimer] = useState(false);
  const trackRef = useRef(null);
  const scrollTimeout = useRef(null);

  function goTo(i) {
    setPage(i);
    const el = trackRef.current;
    if (el) el.scrollTo({ left: i * el.clientWidth, behavior: "smooth" });
  }

  function handleScroll() {
    const el = trackRef.current;
    if (!el) return;
    clearTimeout(scrollTimeout.current);
    scrollTimeout.current = setTimeout(() => {
      const i = Math.round(el.scrollLeft / el.clientWidth);
      setPage((p) => (i !== p ? i : p));
    }, 80);
  }

  const [curKey, curItem] = entries[page];
  const curPlaying = isPlaying && activeLullaby === curKey;
  const ringOffset =
    curItem.type === "audio" ? LULLABY_CIRC * (1 - (curPlaying ? playProgress : 0)) : LULLABY_CIRC * 0.25;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 30, background: "#0d0a1a" }}>
      <div
        style={{
          position: "absolute",
          zIndex: 6,
          left: 64,

          left: 14,

            <div style={{ fontSize: 14, fontWeight: 800, color: "#8E8BC4", marginBottom: 14 }}>
              ⏰ Унтах таймер
              {sleepMinutes && (
                <span style={{ color: "#F3E9C7", fontVariantNumeric: "tabular-nums" }}>
                  {" — "}
                  {formatClock(sleepRemainingSec)} үлдлээ
                </span>
              )}
            </div>
            <div style={{ display: "flex", justifyContent: "center", flexWrap: "wrap", gap: 10 }}>
              {[60, 120, 180].map((mins) => {
                const isActive = sleepMinutes === mins;
                return (
                  <button
                    key={mins}
                    className="btn3d"
                    onClick={() => {
                      onSetSleepTimer(isActive ? null : mins);
                      setShowTimer(false);
                    }}
                    style={{
                      borderRadius: 14,
                      padding: "10px 18px",
                      fontWeight: 800,
                      fontSize: 14,
                      color: isActive ? "#3A2E22" : "#F3E9C7",
                      cursor: "pointer",
                      ...depthStyle(isActive ? "#FFC93C" : "#3A3873", 3),
                    }}
                  >
                    {mins / 60} цаг
                  </button>
                );
              })}
              {sleepMinutes && (
                <button
                  className="btn3d"
                  onClick={() => {
                    onSetSleepTimer(null);
                    setShowTimer(false);
                  }}
                  style={{
                    borderRadius: 14,
                    padding: "10px 18px",
                    fontWeight: 800,
                    fontSize: 14,
                    color: "#F3E9C7",
                    cursor: "pointer",
                    ...depthStyle("#2B2A5C", 3),
                  }}
                >
                  Унтраах
                </button>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Modal({ children, onClose }) {
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(58,46,34,0.45)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 20,
        padding: 20,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "linear-gradient(180deg, #FFFEFA 0%, #FFF8EC 60%)",
          borderRadius: 28,
          padding: "36px 30px",
          textAlign: "center",
          border: "3px solid #FFC93C",
          boxShadow: "0 12px 0 #E4D3B0, 0 20px 40px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(224,100,90,0.22)",
          animation: "popIn 0.3s ease",
          maxWidth: 360,
          width: "100%",
        }}
      >
        {children}
        <div style={{ marginTop: 18, fontSize: 14, fontWeight: 700, color: "#8A7A66" }}>
          Хаахын тулд дарна уу
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        reg.update().catch(() => {});
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  }
</script>
</body>
