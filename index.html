/* (theme-specific tile colors defined per profile below) */

const KNOWN_WORDS = ALPHABET.filter((a) => a.word).reduce((map, a) => {
  map[a.word.toLowerCase()] = a.emoji;
  return map;
}, {});

const GAME_ITEMS = ALPHABET.filter((a) => a.word);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeRound() {
  const item = GAME_ITEMS[Math.floor(Math.random() * GAME_ITEMS.length)];
  const distractors = shuffle(GAME_ITEMS.filter((g) => g.letter !== item.letter)).slice(0, 2);
  const options = shuffle([item, ...distractors]);
  return { item, options };
}

/* ---------- 3D "chunky button" style helper ---------- */

function shade(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  const amt = Math.round(2.55 * percent);
  let r = (num >> 16) + amt;
  let g = ((num >> 8) & 0x00ff) + amt;
  let b = (num & 0x0000ff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

function depthStyle(base, offset = 6) {
  return {
    background: `linear-gradient(180deg, ${shade(base, 22)} 0%, ${base} 55%, ${shade(base, -10)} 100%)`,
    border: `2px solid ${shade(base, -22)}`,
    boxShadow: `0 ${offset}px 0 ${shade(base, -38)}, 0 ${offset + 6}px ${offset + 10}px rgba(0,0,0,0.22), inset 0 0 0 2px rgba(255,201,60,0.45)`,
    "--shadow": shade(base, -38),
  };
}

function Ger({ size = 46 }) {

function Mascot({ bounce, emoji, hopAnim, idleAnim }) {
  return (
    <div
      style={{
        fontSize: 54,
        display: "inline-block",
        transformOrigin: "bottom center",
        animation: bounce ? hopAnim : idleAnim,
        filter: "drop-shadow(0 8px 6px rgba(0,0,0,0.28))",

    >
      {emoji}
    </div>
  );
}

/* ---------- Main App ---------- */

function App() {
  const [screen, setScreen] = useState("profile"); // profile | home | letters | numbers | words | games | game-letters | game-numbers | game-memory | game-counting | lullaby
  const [profile, setProfile] = useState(null); // 'boy' | 'girl' | null
  const [activeLetter, setActiveLetter] = useState(null);
  const [activeNumber, setActiveNumber] = useState(null);
  const [caption, setCaption] = useState("Сайн байна уу! 👋");
  const [hop, setHop] = useState(false);
  const [builtWord, setBuiltWord] = useState([]);
  const [round, setRound] = useState(null);
  const [score, setScore] = useState(0);
  const [feedback, setFeedback] = useState(null); // 'correct' | 'wrong' | null
  const [wrongLetter, setWrongLetter] = useState(null);
  const [numberRound, setNumberRound] = useState(null);
  const [numberScore, setNumberScore] = useState(0);
  const [numberFeedback, setNumberFeedback] = useState(null);
  const [wrongNumber, setWrongNumber] = useState(null);
  const [memoryCards, setMemoryCards] = useState([]);
  const [memoryFirstPick, setMemoryFirstPick] = useState(null);
  const [memoryLock, setMemoryLock] = useState(false);
  const [memoryMoves, setMemoryMoves] = useState(0);
  const [countingTarget, setCountingTarget] = useState(1);
  const [countingCount, setCountingCount] = useState(0);
  const [countingScore, setCountingScore] = useState(0);
  const [countingFeedback, setCountingFeedback] = useState(null);
  const [isPlayingLullaby, setIsPlayingLullaby] = useState(false);
  const [activeLullaby, setActiveLullaby] = useState("steppe");
  const [sleepMinutes, setSleepMinutes] = useState(null);
  const theme = getTheme(profile);
  const audioCtxRef = useRef(null);
  const lullabyTimeoutRef = useRef(null);
  const lullabyPlayingRef = useRef(false);
  const activeLullabyRef = useRef("steppe");
  const noiseSourceRef = useRef(null);
  const noiseGainRef = useRef(null);
  const audioFileRef = useRef(null);
  const sleepTimeoutRef = useRef(null);

  function bumpMascot() {
    setHop(true);
    setTimeout(() => setHop(false), 500);
  }

  function openLetter(item) {
    setActiveLetter(item);
    bumpMascot();
    if (item.word) {
      setCaption(`${item.letter} — ${item.word}`);
    } else {
      setCaption(`${item.letter} — тусгай тэмдэг`);
    }
  }

  function openNumber(item) {
    setActiveNumber(item);
    bumpMascot();
    setCaption(`${item.n} — ${item.word}`);
  }

  function addToWord(letter) {
    setBuiltWord((prev) => {
      const next = [...prev, letter];
      const asWord = next.join("").toLowerCase();
      if (KNOWN_WORDS[asWord]) {
        setCaption(`${next.join("")} — гэж бичлээ! ${KNOWN_WORDS[asWord]}`);
      } else {
        setCaption(`Үсэг нэмлээ: ${letter}`);
      }
      return next;
    });
    bumpMascot();
  }

  function backspaceWord() {
    setBuiltWord((prev) => prev.slice(0, -1));
    setCaption("Сүүлийн үсгийг арилгалаа");
  }

  function clearWord() {
    setBuiltWord([]);
    setCaption("Шинээр эхэллээ! ✍️");
  }

  function startGame() {
    setScore(0);
    setFeedback(null);
    setWrongLetter(null);
    setRound(makeRound());
    setCaption("Зөв үсгийг ол! 🎯");
    setScreen("game-letters");
  }

  function answerGame(option) {
    if (!round || feedback === "correct") return;
    if (option.letter === round.item.letter) {
      setFeedback("correct");
      setWrongLetter(null);
      setScore((s) => s + 1);
      bumpMascot();
      setCaption(`Зөв байна! ${option.letter} — ${option.word} ${option.emoji}`);
      setTimeout(() => {
        setFeedback(null);
        setRound(makeRound());
        setCaption("Зөв үсгийг ол! 🎯");
      }, 1000);
    } else {
      setWrongLetter(option.letter);
      setCaption("Дахин оролдоорой 💪");
      setTimeout(() => setWrongLetter(null), 500);
    }
  }

  function makeNumberRound() {
    const target = NUMBERS[Math.floor(Math.random() * NUMBERS.length)];
    const distractors = shuffle(NUMBERS.filter((n) => n.n !== target.n)).slice(0, 2);
    const options = shuffle([target, ...distractors]);
    return { target, options };
  }

  function startNumberGame() {
    setNumberScore(0);
    setNumberFeedback(null);
    setWrongNumber(null);
    setNumberRound(makeNumberRound());
    setCaption("Хэдэн хонь байна вэ? 🐑");
    setScreen("game-numbers");
  }

  function answerNumberGame(option) {
    if (!numberRound || numberFeedback === "correct") return;
    if (option.n === numberRound.target.n) {
      setNumberFeedback("correct");
      setWrongNumber(null);
      setNumberScore((s) => s + 1);
      bumpMascot();
      setCaption(`Зөв байна! ${option.n} — ${option.word}`);
      setTimeout(() => {
        setNumberFeedback(null);
        setNumberRound(makeNumberRound());
        setCaption("Хэдэн хонь байна вэ? 🐑");
      }, 1000);
    } else {
      setWrongNumber(option.n);
      setCaption("Дахин тоолоорой 💪");
      setTimeout(() => setWrongNumber(null), 500);
    }
  }

  function startMemoryGame() {
    const picks = shuffle(GAME_ITEMS).slice(0, 6);
    const deck = shuffle(
      picks.flatMap((item, i) => [
        { id: `${i}-a`, key: item.letter, emoji: item.emoji, flipped: false, matched: false },
        { id: `${i}-b`, key: item.letter, emoji: item.emoji, flipped: false, matched: false },
      ])
    );
    setMemoryCards(deck);
    setMemoryFirstPick(null);
    setMemoryLock(false);
    setMemoryMoves(0);
    setCaption("Хос ол! 🧠");
    setScreen("game-memory");
  }

  function flipMemoryCard(index) {
    if (memoryLock) return;
    const card = memoryCards[index];
    if (!card || card.flipped || card.matched) return;

    const next = memoryCards.map((c, i) => (i === index ? { ...c, flipped: true } : c));
    setMemoryCards(next);

    if (memoryFirstPick === null) {
      setMemoryFirstPick(index);
      return;
    }

    setMemoryMoves((m) => m + 1);
    const first = next[memoryFirstPick];
    if (first.key === card.key) {
      setMemoryCards((prev) =>
        prev.map((c, i) => (i === memoryFirstPick || i === index ? { ...c, matched: true } : c))
      );
      setMemoryFirstPick(null);
      bumpMascot();
      setCaption("Хос олдлоо! 🎉");
    } else {
      setMemoryLock(true);
      setCaption("Дахин оролдоорой 💪");
      setTimeout(() => {
        setMemoryCards((prev) =>
          prev.map((c, i) => (i === memoryFirstPick || i === index ? { ...c, flipped: false } : c))
        );
        setMemoryFirstPick(null);
        setMemoryLock(false);
      }, 800);
    }
  }

  function startCountingGame() {
    setCountingTarget(1 + Math.floor(Math.random() * 10));
    setCountingCount(0);
    setCountingScore(0);
    setCountingFeedback(null);
    setCaption("Тоогоо дараад тоол! 👆");
    setScreen("game-counting");
  }

  function tapCounting() {
    if (countingFeedback) return;
    setCountingCount((c) => c + 1);
  }

  function resetCounting() {
    setCountingCount(0);
    setCountingFeedback(null);
  }

  useEffect(() => {
    if (screen !== "game-counting" || countingCount === 0) return;
    if (countingCount === countingTarget) {
      setCountingFeedback("correct");
      setCountingScore((s) => s + 1);
      bumpMascot();
      setCaption(`Зөв! ${countingTarget} 🎉`);
      const t = setTimeout(() => {
        setCountingTarget(1 + Math.floor(Math.random() * 10));
        setCountingCount(0);
        setCountingFeedback(null);
        setCaption("Тоогоо дараад тоол! 👆");
      }, 1000);
      return () => clearTimeout(t);
    }
    if (countingCount > countingTarget) {
      setCountingFeedback("wrong");
      setCaption("Хэтэрлээ, дахин эхэл 💪");
      const t = setTimeout(() => {
        setCountingCount(0);
        setCountingFeedback(null);
      }, 600);
      return () => clearTimeout(t);
    }
  }, [countingCount, screen]);

  function ensureAudioCtx() {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  }

  function playTone(ctx, freq, startTime, dur) {
    if (!freq) return; // rest
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(10.5, startTime + 0.08);
    gain.gain.linearRampToValueAtTime(0, startTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
  }

  function scheduleLullabyLoop() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const sequence = LULLABIES[activeLullabyRef.current].notes;
    let t = ctx.currentTime + 0.15;
    let total = 0;
    sequence.forEach(({ note, dur }) => {
      playTone(ctx, note ? NOTE_FREQ[note] : null, t, dur * 0.9);
      t += dur;
      total += dur;
    });
    lullabyTimeoutRef.current = setTimeout(() => {
      if (lullabyPlayingRef.current) scheduleLullabyLoop();
    }, total * 1000);
  }

  function startShush() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1100;
    filter.Q.value = 0.6;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.6);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();

    noiseSourceRef.current = source;
    noiseGainRef.current = gain;
  }

  function thump(ctx, startTime, freq, dur, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, startTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.6, 30), startTime + dur);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.02);
  }

  function scheduleHeartbeatLoop() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    let t = ctx.currentTime + 0.1;
    const cycle = 0.8;
    const beatsPerBatch = 6;
    for (let i = 0; i < beatsPerBatch; i++) {
      thump(ctx, t, 90, 0.15, 0.5);
      thump(ctx, t + 0.18, 68, 0.15, 0.4);
      t += cycle;
    }
    const total = cycle * beatsPerBatch;
    lullabyTimeoutRef.current = setTimeout(() => {
      if (lullabyPlayingRef.current) scheduleHeartbeatLoop();
    }, total * 1000);
  }

  function startAudioFile(src) {
    const audio = new Audio(encodeURI(src));
    audio.loop = true;
    audio.volume = 0.8;
    audio.play().catch(() => {});
    audioFileRef.current = audio;
  }

  function setLullabySleepTimer(minutes) {
    if (sleepTimeoutRef.current) {
      clearTimeout(sleepTimeoutRef.current);
      sleepTimeoutRef.current = null;
    }
    setSleepMinutes(minutes);
    if (minutes) {
      sleepTimeoutRef.current = setTimeout(() => {
        sleepTimeoutRef.current = null;
        stopLullaby();
        setCaption("Тайван нойрсоорой... 💤");
      }, minutes * 60 * 1000);
    }
  }

  function stopLullaby() {
    lullabyPlayingRef.current = false;
    setIsPlayingLullaby(false);
    if (sleepTimeoutRef.current) {
      clearTimeout(sleepTimeoutRef.current);
      sleepTimeoutRef.current = null;
    }
    setSleepMinutes(null);
    if (lullabyTimeoutRef.current) clearTimeout(lullabyTimeoutRef.current);
    if (audioFileRef.current) {
      audioFileRef.current.pause();
      audioFileRef.current.currentTime = 0;
      audioFileRef.current = null;
    }
    if (noiseSourceRef.current) {
      try {
        const ctx = audioCtxRef.current;
        if (noiseGainRef.current && ctx) {
          noiseGainRef.current.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
        }
        noiseSourceRef.current.stop(ctx ? ctx.currentTime + 0.2 : undefined);
      } catch (e) {
        /* already stopped */
      }
      noiseSourceRef.current = null;
      noiseGainRef.current = null;
    }
    if (audioCtxRef.current) audioCtxRef.current.suspend();
  }

  function selectLullaby(key) {
    if (activeLullabyRef.current === key && lullabyPlayingRef.current) {
      stopLullaby();
      setCaption("Ая зогслоо");
      return;
    }
    stopLullaby();
    activeLullabyRef.current = key;
    setActiveLullaby(key);
    lullabyPlayingRef.current = true;
    setIsPlayingLullaby(true);
    const item = LULLABIES[key];
    if (item.type === "audio") {
      startAudioFile(item.src);
    } else if (item.type === "noise" && item.mode === "shush") {
      startShush();
    } else if (item.type === "noise" && item.mode === "heartbeat") {
      scheduleHeartbeatLoop();
    } else {
      scheduleLullabyLoop();
    }
    setCaption(`${item.label} эгшиглэж байна... 💤`);
  }

  function openLullaby() {
    setScreen("lullaby");
    setCaption("Тайван нойрсоорой... 💤");
  }

  function chooseProfile(key) {

  useEffect(() => {

    }
  }, [screen]);

  useEffect(() => {

  }, []);

  return (

        <button
          onClick={onClear}
          disabled={builtWord.length === 0}
          className="btn3d"
          style={{
            borderRadius: 14,
            padding: "10px 18px",
            fontWeight: 800,
            fontSize: 15,
            color: "#FFFFFF",
            cursor: builtWord.length === 0 ? "default" : "pointer",
            opacity: builtWord.length === 0 ? 0.5 : 1,
            ...depthStyle("#E88A4E", 4),
          }}
        >
          🔄 Дахин эхлэх
        </button>
      </div>

      {/* Letter picker */}
      <div
        className="scrollarea"
        style={{
          display: "grid",
          gridTemplateColumns: "repeat(auto-fill, minmax(60px, 1fr))",
          gap: 8,
          maxWidth: 640,
          margin: "0 auto",
        }}
      >
        {ALPHABET.map((item, i) => (
          <button
            key={item.letter}
            className="tile"
            onClick={() => onAdd(item.letter)}
            style={{
              aspectRatio: "1 / 1",
              borderRadius: 16,
              color: "#FFFFFF",
              fontSize: 24,
              fontWeight: 900,
              cursor: "pointer",
              textShadow: "0 2px 0 rgba(0,0,0,0.18)",
              ...depthStyle(tileColors[i % tileColors.length], 4),
            }}
          >
            {item.letter}
          </button>
        ))}
      </div>
    </div>
  );
}

function GameScreen({ round, score, feedback, wrongLetter, onAnswer, accent }) {
  const { item, options } = round;
  return (
    <div style={{ textAlign: "center" }}>
      <div
        style={{
          display: "inline-block",
          background: "#FFFFFF",
          borderRadius: 16,
          padding: "6px 16px",
          fontWeight: 800,
          fontSize: 16,
          color: "#3A2E22",
          marginBottom: 18,
          boxShadow: "0 3px 0 rgba(0,0,0,0.1)",
        }}
      >
        ⭐ {score}
      </div>

      <div
        style={{
          fontSize: 90,
          animation: feedback === "correct" ? "celebrate 0.6s ease" : "none",
        }}
      >
        {item.emoji}
      </div>
      <div style={{ fontSize: 24, fontWeight: 800, color: "#B5773A", margin: "6px 0 26px" }}>
        {item.word}
      </div>

      <div
        style={{
          display: "flex",
          gap: 14,
          justifyContent: "center",
          flexWrap: "wrap",
          maxWidth: 400,
          margin: "0 auto",
        }}
      >
        {options.map((opt) => {
          const optColor = feedback === "correct" && opt.letter === item.letter ? "#5FBF6A" : accent;
          return (
            <button
              key={opt.letter}
              className="tile"
              onClick={() => onAnswer(opt)}
              style={{
                width: 84,
                height: 84,
                borderRadius: 20,
                color: "#FFFFFF",
                fontSize: 34,
                fontWeight: 900,
                cursor: "pointer",
                textShadow: "0 2px 0 rgba(0,0,0,0.18)",
                animation: wrongLetter === opt.letter ? "shakeWrong 0.4s ease" : "none",
                ...depthStyle(optColor, 5),
              }}
            >
              {opt.letter}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function NumberGameScreen({ round, score, feedback, wrongNumber, onAnswer, accent }) {
  const { target, options } = round;
  return (
    <div style={{ textAlign: "center" }}>
      <div
        style={{
          display: "inline-block",
          background: "#FFFFFF",
          borderRadius: 16,
          padding: "6px 16px",
          fontWeight: 800,
          fontSize: 16,
          color: "#3A2E22",
          marginBottom: 18,
          boxShadow: "0 3px 0 rgba(0,0,0,0.1)",
        }}
      >
        ⭐ {score}
      </div>

      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          justifyContent: "center",
          gap: 6,
          maxWidth: 320,
          margin: "0 auto 16px",
          animation: feedback === "correct" ? "celebrate 0.6s ease" : "none",
        }}
      >
        {Array.from({ length: target.n }).map((_, i) => (
          <span key={i} style={{ fontSize: 34, animation: `popIn 0.3s ease ${i * 0.05}s both` }}>
            🐑
          </span>
        ))}
      </div>

      <div style={{ fontSize: 20, fontWeight: 800, color: "#B5773A", margin: "0 0 26px" }}>
        Хэдэн хонь вэ?
      </div>

      <div
        style={{
          display: "flex",
          gap: 14,
          justifyContent: "center",
          flexWrap: "wrap",
          maxWidth: 400,
          margin: "0 auto",
        }}
      >
        {options.map((opt) => {
          const optColor = feedback === "correct" && opt.n === target.n ? "#5FBF6A" : accent;
          return (
            <button
              key={opt.n}
              className="tile"
              onClick={() => onAnswer(opt)}
              style={{
                width: 84,
                height: 84,
                borderRadius: 20,
                color: "#FFFFFF",
                fontSize: 34,
                fontWeight: 900,
                cursor: "pointer",
                textShadow: "0 2px 0 rgba(0,0,0,0.18)",
                animation: wrongNumber === opt.n ? "shakeWrong 0.4s ease" : "none",
                ...depthStyle(optColor, 5),
              }}
            >
              {opt.n}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function MemoryGameScreen({ cards, moves, accent, tileColors, onFlip }) {
  const allMatched = cards.length > 0 && cards.every((c) => c.matched);
  return (
    <div style={{ textAlign: "center" }}>
      <div
        style={{
          display: "inline-block",
          background: "#FFFFFF",
          borderRadius: 16,
          padding: "6px 16px",
          fontWeight: 800,
          fontSize: 16,
          color: "#3A2E22",
          marginBottom: 18,
          boxShadow: "0 3px 0 rgba(0,0,0,0.1)",
        }}
      >
        🔄 {moves}
      </div>

      {allMatched && (
        <div style={{ fontSize: 18, fontWeight: 800, color: "#5FBF6A", marginBottom: 14 }}>
          Баяр хүргэе! Бүгдийг олов 🎉
        </div>
      )}

      <div
        className="scrollarea"
        style={{
          display: "grid",
          gridTemplateColumns: "repeat(4, 1fr)",
          gap: 10,
          maxWidth: 400,
          margin: "0 auto",
        }}
      >
        {cards.map((card, i) => (
          <button
            key={card.id}
            className="tile"
            onClick={() => onFlip(i)}
            style={{
              aspectRatio: "1 / 1",
              borderRadius: 16,
              color: "#FFFFFF",
              fontSize: 30,
              fontWeight: 900,
              cursor: card.matched ? "default" : "pointer",
              opacity: card.matched ? 0.55 : 1,
              pointerEvents: card.matched ? "none" : "auto",
              ...depthStyle(card.flipped || card.matched ? tileColors[i % tileColors.length] : accent, 4),
            }}
          >
            {card.flipped || card.matched ? card.emoji : "❓"}
          </button>
        ))}
      </div>
    </div>
  );
}

function CountingGameScreen({ target, count, score, feedback, accent, onTap, onReset }) {
  return (
    <div style={{ textAlign: "center" }}>
      <div
        style={{
          display: "inline-block",
          background: "#FFFFFF",
          borderRadius: 16,
          padding: "6px 16px",
          fontWeight: 800,
          fontSize: 16,
          color: "#3A2E22",
          marginBottom: 18,
          boxShadow: "0 3px 0 rgba(0,0,0,0.1)",
        }}
      >
        ⭐ {score}
      </div>

      <div style={{ fontSize: 20, fontWeight: 800, color: "#B5773A", marginBottom: 10 }}>
        Энэ тоо хүртэл дар: {target}
      </div>

      <div
        style={{
          fontSize: 90,
          fontWeight: 900,
          color: feedback === "wrong" ? "#E85A5A" : "#3A2E22",
          marginBottom: 16,
          animation:
            feedback === "correct" ? "celebrate 0.6s ease" : feedback === "wrong" ? "shakeWrong 0.4s ease" : "none",
        }}
      >
        {count}
      </div>

      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          justifyContent: "center",
          gap: 6,
          maxWidth: 320,
          margin: "0 auto 26px",
          minHeight: 40,
        }}
      >
        {Array.from({ length: count }).map((_, i) => (
          <span key={i} style={{ fontSize: 28, animation: "popIn 0.25s ease" }}>
            🐑
          </span>
        ))}
      </div>

      <button
        className="tile"
        onClick={onTap}
        disabled={feedback === "correct"}
        style={{
          width: 130,
          height: 130,
          borderRadius: "50%",
          fontSize: 46,
          fontWeight: 900,
          color: "#FFFFFF",
          cursor: feedback === "correct" ? "default" : "pointer",
          ...depthStyle(accent, 8),
        }}
      >
        👆
      </button>

      <div style={{ marginTop: 20 }}>
        <button
          onClick={onReset}
          className="btn3d"
          style={{
            borderRadius: 14,
            padding: "8px 16px",
            fontWeight: 800,
            fontSize: 14,
            color: "#3A2E22",
            cursor: "pointer",
            ...depthStyle("#FFFFFF", 3),
          }}
        >
          🔄 Дахин эхлэх
        </button>
      </div>
    </div>
  );
}

function LullabyScreen({ isPlaying, activeLullaby, onSelect, sleepMinutes, onSetSleepTimer }) {
  const melodies = Object.entries(LULLABIES).filter(([, l]) => l.category === "melody");
  const soothing = Object.entries(LULLABIES).filter(([, l]) => l.category === "soothing");

  return (
    <div style={{ textAlign: "center", paddingTop: 20 }}>
      <div
        style={{
          fontSize: 70,
          marginBottom: 10,
          display: "inline-block",
          animation: isPlaying
            ? "moonFloatGlow 2.6s ease-in-out infinite"
            : "moonFloat 4s ease-in-out infinite",
        }}
      >
        🌙
      </div>
      <div style={{ fontSize: 20, fontWeight: 800, color: "#F3E9C7", marginBottom: 8 }}>
        Тайван нойрсоорой
      </div>
      <div style={{ fontSize: 14, fontWeight: 700, color: "#B7B4E0", marginBottom: 22 }}>
        Дуртай аяа сонго
      </div>

      <LullabyGroup items={melodies} activeLullaby={activeLullaby} isPlaying={isPlaying} onSelect={onSelect} />

      <div style={{ fontSize: 13, fontWeight: 800, color: "#8E8BC4", margin: "22px 0 10px" }}>
        Тайвшруулах чимээ
      </div>
      <LullabyGroup items={soothing} activeLullaby={activeLullaby} isPlaying={isPlaying} onSelect={onSelect} />

      <div style={{ fontSize: 13, fontWeight: 800, color: "#8E8BC4", margin: "22px 0 10px" }}>
        ⏰ Унтах таймер
      </div>
      <div
        style={{
          display: "flex",
          justifyContent: "center",
          flexWrap: "wrap",
          gap: 8,
          maxWidth: 320,
          margin: "0 auto",
        }}
      >
        {[10, 20, 30].map((mins) => {
          const isActive = sleepMinutes === mins;
          return (
            <button
              key={mins}
              className="btn3d"
              onClick={() => onSetSleepTimer(isActive ? null : mins)}
              style={{
                borderRadius: 14,
                padding: "8px 14px",
                fontWeight: 800,
                fontSize: 13,
                color: isActive ? "#3A2E22" : "#F3E9C7",
                cursor: "pointer",
                ...depthStyle(isActive ? "#FFC93C" : "#3A3873", 3),
              }}
            >
              {mins} мин
            </button>
          );
        })}
        {sleepMinutes && (
          <button
            className="btn3d"
            onClick={() => onSetSleepTimer(null)}
            style={{
              borderRadius: 14,
              padding: "8px 14px",
              fontWeight: 800,
              fontSize: 13,
              color: "#F3E9C7",
              cursor: "pointer",
              ...depthStyle("#2B2A5C", 3),
            }}
          >
            Унтраах
          </button>
        )}
      </div>
    </div>
  );
}

function LullabyGroup({ items, activeLullaby, isPlaying, onSelect }) {
  return (
    <div
      style={{
        display: "flex",
        flexDirection: "column",
        gap: 12,
        maxWidth: 320,
        margin: "0 auto",
      }}
    >
      {items.map(([key, l]) => {
        const isActive = activeLullaby === key;
        const isActivePlaying = isActive && isPlaying;
        return (
          <button
            key={key}
            className="tile"
            onClick={() => onSelect(key)}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 14,
              borderRadius: 20,
              padding: "14px 18px",
              cursor: "pointer",
              textAlign: "left",
              ...depthStyle(isActive ? "#3A3873" : "#2B2A5C", 4),
              ...(isActive ? { border: "3px solid #F3E9C7" } : {}),
            }}
          >
            <span
              style={{
                fontSize: 30,
                animation: isActivePlaying ? "moonGlow 1.8s ease-in-out infinite" : "none",
              }}
            >
              {l.emoji}
            </span>
            <span style={{ flex: 1, fontSize: 18, fontWeight: 800, color: "#F3E9C7" }}>
              {l.label}
            </span>
            <span style={{ fontSize: 22 }}>{isActivePlaying ? "⏸" : "▶"}</span>
          </button>
        );
      })}
    </div>
  );
}

function Modal({ children, onClose }) {
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(58,46,34,0.45)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 20,
        padding: 20,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "linear-gradient(180deg, #FFFEFA 0%, #FFF8EC 60%)",
          borderRadius: 28,
          padding: "36px 30px",
          textAlign: "center",
          border: "3px solid #FFC93C",
          boxShadow: "0 12px 0 #E4D3B0, 0 20px 40px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(224,100,90,0.22)",
          animation: "popIn 0.3s ease",
          maxWidth: 360,
          width: "100%",
        }}
      >
        {children}
        <div style={{ marginTop: 18, fontSize: 14, fontWeight: 700, color: "#8A7A66" }}>
          Хаахын тулд дарна уу
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
