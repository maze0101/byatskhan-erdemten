/* ---------- Saved progress (localStorage) ---------- */

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}

function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

// Keyed by subject kind (not index) so reordering subjects keeps stats.
function lessonKey(grade, subject, lessonIdx) {
  return `${grade}-${subject.kind}-${lessonIdx}`;
}

function dateKey(d) {
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function todayKey() {
  return dateKey(new Date());
}

function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return dateKey(d);
}

// A streak survives until the end of the day after the last completed task.
function currentStreak(daily) {
  return daily.last === todayKey() || daily.last === yesterdayKey() ? daily.streak : 0;
}

// Same question all day for a grade; changes every day.
function dailyQuestion(grade) {
  const g = GRADES.find((x) => x.grade === grade) || GRADES[0];
  const pool = g.subjects.flatMap((s) => s.lessons.flatMap((l) => l.quiz.map((q) => ({ ...q, subject: s }))));
  const d = new Date();
  const pick = rng(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate() + grade)();
  return pool[Math.floor(pick * pool.length)];
}

const KNOWN_WORDS = ALPHABET.filter((a) => a.word).reduce((map, a) => {
  map[a.word.toLowerCase()] = a.emoji;
  return map;
}, {});

const GAME_ITEMS = ALPHABET.filter((a) => a.word);

function rng(seed) {
  let s = seed * 9301 + 49297;
  return () => (s = (s * 9301 + 49297) % 233280) / 233280;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeRound() {
  const item = GAME_ITEMS[Math.floor(Math.random() * GAME_ITEMS.length)];
  const distractors = shuffle(GAME_ITEMS.filter((g) => g.letter !== item.letter)).slice(0, 2);
  const options = shuffle([item, ...distractors]);
  return { item, options };
}

/* ---------- 3D "chunky button" style helper ---------- */

function shade(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  const amt = Math.round(2.55 * percent);
  let r = (num >> 16) + amt;
  let g = ((num >> 8) & 0x00ff) + amt;
  let b = (num & 0x0000ff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

function depthStyle(base, offset = 6) {
  return {
    background: `linear-gradient(180deg, ${shade(base, 22)} 0%, ${base} 55%, ${shade(base, -10)} 100%)`,
    border: `2px solid ${shade(base, -22)}`,
    boxShadow: `0 ${offset}px 0 ${shade(base, -38)}, 0 ${offset + 6}px ${offset + 10}px rgba(0,0,0,0.22), inset 0 0 0 2px rgba(255,201,60,0.45)`,
    "--shadow": shade(base, -38),
  };
}

  function startMemoryGame() {
    const picks = shuffle(GAME_ITEMS).slice(0, 6);
    const deck = shuffle(
      picks.flatMap((item, i) => [
        { id: `${i}-a`, key: item.letter, emoji: item.emoji, flipped: false, matched: false },
        { id: `${i}-b`, key: item.letter, emoji: item.emoji, flipped: false, matched: false },
      ])
    );
    setMemoryCards(deck);
    setMemoryFirstPick(null);
    setMemoryLock(false);
    setMemoryMoves(0);
    setCaption("Хос ол! 🧠");
    setScreen("game-memory");
  }

  function flipMemoryCard(index) {
    if (memoryLock) return;
    const card = memoryCards[index];
    if (!card || card.flipped || card.matched) return;

    const next = memoryCards.map((c, i) => (i === index ? { ...c, flipped: true } : c));
    setMemoryCards(next);

    if (memoryFirstPick === null) {
      setMemoryFirstPick(index);
      return;
    }

    setMemoryMoves((m) => m + 1);
    const first = next[memoryFirstPick];
    if (first.key === card.key) {
      setMemoryCards((prev) =>
        prev.map((c, i) => (i === memoryFirstPick || i === index ? { ...c, matched: true } : c))
      );
      setMemoryFirstPick(null);
      bumpMascot();
      setCaption("Хос олдлоо! 🎉");
    } else {
      setMemoryLock(true);
      setCaption("Дахин оролдоорой 💪");
      setTimeout(() => {
        setMemoryCards((prev) =>
          prev.map((c, i) => (i === memoryFirstPick || i === index ? { ...c, flipped: false } : c))
        );
        setMemoryFirstPick(null);
        setMemoryLock(false);
      }, 800);
    }
  }

  function ensureAudioCtx() {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new Ctx();
    }
    return audioCtxRef.current;
  }

  function playTone(ctx, freq, startTime, dur) {
    if (!freq) return; // rest
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(10.5, startTime + 0.08);
    gain.gain.linearRampToValueAtTime(0, startTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
  }

  function scheduleLullabyLoop() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const sequence = LULLABIES[activeLullabyRef.current].notes;
    let t = ctx.currentTime + 0.15;
    let total = 0;
    sequence.forEach(({ note, dur }) => {
      playTone(ctx, note ? NOTE_FREQ[note] : null, t, dur * 0.9);
      t += dur;
      total += dur;
    });
    lullabyTimeoutRef.current = setTimeout(() => {
      if (lullabyPlayingRef.current) scheduleLullabyLoop();
    }, total * 1000);
  }

  function startShush() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1100;
    filter.Q.value = 0.6;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.6);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();

    noiseSourceRef.current = source;
    noiseGainRef.current = gain;
  }

  function thump(ctx, startTime, freq, dur, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, startTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.6, 30), startTime + dur);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.02);
  }

  function scheduleHeartbeatLoop() {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    let t = ctx.currentTime + 0.1;
    const cycle = 0.8;
    const beatsPerBatch = 6;
    for (let i = 0; i < beatsPerBatch; i++) {
      thump(ctx, t, 90, 0.15, 0.5);
      thump(ctx, t + 0.18, 68, 0.15, 0.4);
      t += cycle;
    }
    const total = cycle * beatsPerBatch;
    lullabyTimeoutRef.current = setTimeout(() => {
      if (lullabyPlayingRef.current) scheduleHeartbeatLoop();
    }, total * 1000);
  }

  function startAudioFile(src) {
    const audio = new Audio(encodeURI(src));
    audio.loop = true;
    audio.volume = 0.8;

  function setLullabySleepTimer(minutes) {
    if (sleepTimeoutRef.current) {
      clearTimeout(sleepTimeoutRef.current);
      sleepTimeoutRef.current = null;

    if (sleepTickRef.current) {
      clearInterval(sleepTickRef.current);
      sleepTickRef.current = null;

    setSleepMinutes(minutes);
    if (minutes) {
      const endsAt = Date.now() + minutes * 60 * 1000;
      sleepEndsAtRef.current = endsAt;
      setSleepRemainingSec(minutes * 60);
      sleepTickRef.current = setInterval(() => {
        setSleepRemainingSec(Math.max(0, Math.round((sleepEndsAtRef.current - Date.now()) / 1000)));
      }, 1000);
      sleepTimeoutRef.current = setTimeout(() => {
        sleepTimeoutRef.current = null;
        stopLullaby();
        setCaption("Тайван нойрсоорой... 💤");
      }, minutes * 60 * 1000);
    } else {
      sleepEndsAtRef.current = null;
      setSleepRemainingSec(0);
    }
  }

  function stopLullaby() {
    lullabyPlayingRef.current = false;
    setIsPlayingLullaby(false);

      sleepTimeoutRef.current = null;
    }
    if (sleepTickRef.current) {
      clearInterval(sleepTickRef.current);
      sleepTickRef.current = null;
    }
    sleepEndsAtRef.current = null;
    setSleepMinutes(null);
    setSleepRemainingSec(0);
    if (lullabyTimeoutRef.current) clearTimeout(lullabyTimeoutRef.current);
    if (audioFileRef.current) {
      audioFileRef.current.pause();
      audioFileRef.current.currentTime = 0;
      audioFileRef.current = null;
    }
    if (noiseSourceRef.current) {
      try {
        const ctx = audioCtxRef.current;
        if (noiseGainRef.current && ctx) {
          noiseGainRef.current.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.15);
        }
        noiseSourceRef.current.stop(ctx ? ctx.currentTime + 0.2 : undefined);
      } catch (e) {
        /* already stopped */
      }
      noiseSourceRef.current = null;
      noiseGainRef.current = null;
    }
    if (audioCtxRef.current) audioCtxRef.current.suspend();
  }

function drawQuiz(lesson) {
  return shuffle(lesson.quiz)
    .slice(0, QUIZ_LENGTH)
    .map((item) => ({ ...item, options: shuffle(item.options) }));
}

function LessonScreen({ grade, subjectIdx, lessonIdx, accent, onCaption, onFinish, onBack }) {
  const subject = grade.subjects[subjectIdx];
  const lesson = subject.lessons[lessonIdx];
  const style = SUBJECT_STYLES[subject.kind];
  const [quiz, setQuiz] = useState(() => drawQuiz(lesson));
  const [mistakes, setMistakes] = useState(0);
  const [phase, setPhase] = useState("learn"); // learn | quiz | done
  const [qIndex, setQIndex] = useState(0);
  const [picked, setPicked] = useState(null);
  const [wrong, setWrong] = useState(null);
  const [missed, setMissed] = useState(false);
  const [correctCount, setCorrectCount] = useState(0);

  const card = {
    background: "#FFFFFF",
    borderRadius: 22,
    padding: "20px 18px",
    boxShadow: "0 6px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(0,0,0,0.08)",
    marginBottom: 16,
  };

  function answer(option) {
    if (picked) return;
    const current = quiz[qIndex];
    if (option === current.answer) {
      const finalCorrect = correctCount + (missed ? 0 : 1);
      setPicked(option);
      setCorrectCount(finalCorrect);
      onCaption("Зөв байна! 🎉");
      setTimeout(() => {
        setPicked(null);
        setMissed(false);
        setWrong(null);
        if (qIndex + 1 < quiz.length) {
          setQIndex(qIndex + 1);
        } else {
          setPhase("done");
          onFinish(lessonKey(grade.grade, subject, lessonIdx), finalCorrect, mistakes);
          onCaption("Хичээлээ дуусгалаа! 🏆");
        }
      }, 800);
    } else {
      setWrong(option);
      setMissed(true);
      setMistakes((m) => m + 1);
      onCaption("Дахиад оролдоорой 💪");
      setTimeout(() => setWrong(null), 400);
    }
  }

  function restart() {
    setQuiz(drawQuiz(lesson));
    setPhase("learn");
    setQIndex(0);
    setCorrectCount(0);
    setMistakes(0);
    setMissed(false);

          </div>

          </div>

      {phase === "quiz" && (
        <div style={{ ...card, textAlign: "center" }}>
          <div style={{ fontSize: 14, fontWeight: 800, color: "#8A7A66", marginBottom: 8 }}>
            {qIndex + 1} / {quiz.length}
          </div>
          <div key={qIndex} style={{ fontSize: 21, fontWeight: 800, color: "#3A2E22", marginBottom: 20, animation: "popIn 0.3s ease" }}>
            {quiz[qIndex].q}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {quiz[qIndex].options.map((opt) => (
              <button
                key={opt}
                className="tile"
                onClick={() => answer(opt)}
                style={{
                  borderRadius: 16,
                  padding: "14px 16px",
                  fontSize: 20,
                  fontWeight: 800,
                  color: "#FFFFFF",
                  cursor: "pointer",
                  textShadow: "0 2px 0 rgba(0,0,0,0.15)",
                  animation: wrong === opt ? "shakeWrong 0.4s ease" : picked === opt ? "celebrate 0.6s ease" : "none",
                  ...depthStyle(picked === opt ? "#5FBF6A" : wrong === opt ? "#D9534F" : style.color, 5),
                }}
              >
                {opt}
              </button>
            ))}
          </div>
        </div>

      {phase === "done" && (
        <div style={{ ...card, textAlign: "center", animation: "popIn 0.4s ease" }}>
          <div style={{ fontSize: 70 }}>{correctCount === quiz.length ? "🏆" : "⭐"}</div>

          </div>

function DailyTask({ grade, done, streak, onComplete, onWrong }) {
  const [item] = useState(() => {
    const q = dailyQuestion(grade);
    return { ...q, options: shuffle(q.options) };

  const [solved, setSolved] = useState(done);
  const [wrong, setWrong] = useState(null);

    if (solved) return;
    if (option === item.answer) {
      setSolved(true);
      onComplete();

      setTimeout(() => setWrong(null), 400);

  return (

// Angles for arcs are in degrees, canvas-style: 0 right, 90 down, -90 up.

  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = ((a0 + ((a1 - a0) * i) / n) * Math.PI) / 180;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}

function setTraceFont(ctx, size, text, mode) {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (mode.script === "mongol") {
    // Drawn rotated, so the text's width is its height on the board.
    const font = (px) => `${px}px 'Noto Sans Mongolian', sans-serif`;
    let px = Math.round(size * 0.6);
    ctx.font = font(px);
    const w = ctx.measureText(text).width;
    if (w > size * 0.86) ctx.font = font(Math.floor((px * size * 0.86) / w));
    return;
  }
  const font = (px) => `900 ${px}px Montserrat, 'Baloo 2', sans-serif`;
  let px = Math.round(size * (mode.lower ? 0.92 : 0.78));
  ctx.font = font(px);
  const w = ctx.measureText(text).width;
  if (w > size * 0.88) {
    px = Math.floor((px * size * 0.88) / w);
    ctx.font = font(px);
  }
}

// Mongolian script is vertical: its glyphs lie on their side in a horizontal
// canvas, so it is drawn rotated a quarter turn to stand upright.
function paintTraceGlyph(ctx, size, text, mode, dashed, fill = "#EFE6D6") {
  setTraceFont(ctx, size, text, mode);
  ctx.save();
  let x = size / 2, y = size * 0.54;
  if (mode.script === "mongol") {
    ctx.translate(size / 2, size / 2);
    ctx.rotate(Math.PI / 2);
    x = 0;
    y = 0;
  }
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
  if (dashed) {
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#C4B294";
    ctx.strokeText(text, x, y);
  }
  ctx.restore();
}

// Every stroke of `text` in canvas pixels, letter by letter, in writing order.
function traceStrokePixels(ctx, size, text, mode) {
  if (mode.script === "mongol") return [];
  setTraceFont(ctx, size, text, mode);
  const ref = ctx.measureText(mode.lower ? "н" : "Н");
  const top = size * 0.54 - ref.actualBoundingBoxAscent;
  const height = ref.actualBoundingBoxAscent + ref.actualBoundingBoxDescent;
  let x = size / 2 - ctx.measureText(text).width / 2;
  ctx.textAlign = "left";
  const out = [];
  for (const ch of text) {
    const m = ctx.measureText(ch);
    const left = x - m.actualBoundingBoxLeft;
    const width = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    glyphStrokes(ch).forEach((stroke) => out.push(stroke.map(([px, py]) => ({ x: left + px * width, y: top + py * height }))));
    x += m.width;
  }
  return out;
}

// Draws the numbered, arrowed strokes up to `progress` (fractional part = the
// stroke in progress). With `pen`, a pencil rides the tip of the current stroke.
function drawStrokeDemo(ctx, size, strokes, progress, pen = false) {
  const color = "#FF8A3D";
  const r = Math.max(8, size * (strokes.length > 6 ? 0.03 : 0.038));
  let penTip = null;
  const dots = []; // start dots placed so far, to keep shared starts (Д, П…) readable
  strokes.forEach((pts, si) => {
    if (progress <= si) return;
    const segs = pts.slice(1).map((p, i) => Math.hypot(p.x - pts[i].x, p.y - pts[i].y));
    const total = segs.reduce((a, b) => a + b, 0);
    let remaining = total * Math.min(1, progress - si);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = size * 0.03;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    let tip = pts[0], dir = { x: 1, y: 0 };
    for (let i = 0; i < segs.length && remaining > 0; i++) {
      const t = Math.min(1, remaining / (segs[i] || 1));
      tip = { x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t };
      if (segs[i] > 0) dir = { x: (pts[i + 1].x - pts[i].x) / segs[i], y: (pts[i + 1].y - pts[i].y) / segs[i] };
      ctx.lineTo(tip.x, tip.y);
      remaining -= segs[i];
    }
    ctx.stroke();
    if (progress - si < 1) penTip = tip;
    // Arrow head showing which way to move.
    if (total > size * 0.05) {
      const a = size * 0.045;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(tip.x + dir.x * a * 0.6, tip.y + dir.y * a * 0.6);
      ctx.lineTo(tip.x - dir.x * a + dir.y * a * 0.7, tip.y - dir.y * a - dir.x * a * 0.7);
      ctx.lineTo(tip.x - dir.x * a - dir.y * a * 0.7, tip.y - dir.y * a + dir.x * a * 0.7);
      ctx.closePath();
      ctx.fill();
    }
    // Numbered start dot, nudged along its stroke if an earlier dot sits there.
    let dot = pts[0];
    if (dots.some((d) => Math.hypot(d.x - dot.x, d.y - dot.y) < r * 1.8) && segs[0] > 0) {
      const ux = (pts[1].x - pts[0].x) / segs[0], uy = (pts[1].y - pts[0].y) / segs[0];
      const shift = Math.min(r * 2.2, segs[0]);
      dot = { x: dot.x + ux * shift, y: dot.y + uy * shift };
    }
    dots.push(dot);
    ctx.fillStyle = "#3A9E4A";
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.font = `800 ${Math.round(r * 1.3)}px Montserrat, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(si + 1), dot.x, dot.y + 1);
  });
  if (pen && penTip) {
    // ✏️ writes with its bottom-left corner, so draw it up and right of the tip.
    ctx.font = `${Math.round(size * 0.16)}px sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("✏️", penTip.x - size * 0.02, penTip.y + size * 0.03);
  }
}

// Where a traditional-script glyph has ink: for each pixel row, the middle of
// its ink (null if none), plus the first and last inked rows.
const mongolInkCache = new Map();
function mongolInk(size, text, mode) {
  const key = `${size}|${text}`;
  if (mongolInkCache.has(key)) return mongolInkCache.get(key);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  paintTraceGlyph(ctx, size, text, mode, false);
  const data = ctx.getImageData(0, 0, size, size).data;
  const rows = [];
  for (let y = 0; y < size; y++) {
    let sum = 0, n = 0;
    for (let x = 0; x < size; x++) if (data[(y * size + x) * 4 + 3] > 100) { sum += x; n++; }
    rows.push(n ? sum / n : null);
  }
  const top = rows.findIndex((r) => r !== null);
  let bottom = size - 1;
  while (bottom > top && rows[bottom] === null) bottom--;
  const ink = top < 0 ? null : { rows, top, bottom };
  // Don't remember a measurement taken with the fallback font.
  if (!document.fonts || document.fonts.status === "loaded") mongolInkCache.set(key, ink);
  return ink;
}

// Traditional script is written top to bottom, so its demo fills the glyph in
// orange from the top down with the pencil riding the edge. progress 0..1;
// Infinity leaves just the green start dot with its down arrow.
function drawMongolSweep(ctx, size, text, mode, progress, pen = false) {
  const ink = mongolInk(size, text, mode);
  if (!ink) return;
  const { rows, top, bottom } = ink;
  const inkX = (y) => {
    for (let i = Math.round(y); i >= top; i--) if (rows[i] !== null) return rows[i];
    return rows[top];
  };
  let tip = null;
  if (progress !== Infinity) {
    const cut = top + (bottom - top) * Math.min(1, progress);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, size, cut + 1);
    ctx.clip();
    paintTraceGlyph(ctx, size, text, mode, false, "#FF8A3D");
    ctx.restore();
    if (progress < 1) tip = { x: inkX(cut), y: cut };
  }
  const r = Math.max(8, size * 0.038);
  const dot = { x: rows[top], y: top + r * 0.6 };
  const a = size * 0.045;
  const ax = dot.x + r * 2.2;
  ctx.fillStyle = "#3A9E4A";
  ctx.beginPath();
  ctx.arc(dot.x, dot.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(ax - 2, dot.y - r, 4, a * 1.4);
  ctx.beginPath();
  ctx.moveTo(ax - a * 0.6, dot.y - r + a * 1.2);
  ctx.lineTo(ax + a * 0.6, dot.y - r + a * 1.2);
  ctx.lineTo(ax, dot.y - r + a * 2.1);
  ctx.closePath();
  ctx.fill();
  if (pen && tip) {
    ctx.font = `${Math.round(size * 0.16)}px sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("✏️", tip.x - size * 0.02, tip.y + size * 0.03);
  }
}

// Walks the child's strokes against the expected ones. A stroke that starts
// where the previous one ended is a lifted finger, not a new stroke, and extra
// touch-ups after the last stroke are fine.
function checkStrokeOrder(expected, drawn, tol) {
  const near = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) <= tol;
  let j = 0;
  let prevEnd = null;
  for (const d of drawn) {
    const start = d[0];
    const end = d[d.length - 1];
    const exp = expected[j];
    if (exp && near(start, exp[0])) j++;
    else if (prevEnd && near(start, prevEnd)) { /* continuing the same stroke */ }
    else if (!exp) { /* touch-up after the last stroke */ }
    else if (near(end, exp[0]) && near(start, exp[exp.length - 1])) {
      return { ok: false, hint: `${j + 1}-р зурлагыг эсрэг зүгт бичлээ. Сумыг дагаарай` };
    } else {
      return { ok: false, hint: `${j + 1}-р зурлагыг ногоон цэг дээрх ${j + 1} тооноос эхлээрэй` };
    }
    prevEnd = end;
  }
  if (j < expected.length) return { ok: false, hint: `${j + 1}-р зурлагыг бичихээ мартжээ` };
  return { ok: true };
}

// A looping "how to write it" clip shown beside the tracing board.
function TraceVideo({ text, mode, size }) {
  const canvasRef = useRef(null);
  const [playing, setPlaying] = useState(true);
  const [restart, setRestart] = useState(0);
  const dpr = window.devicePixelRatio || 1;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf = 0;
    const paint = (elapsed) => {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);
      paintTraceGlyph(ctx, size, text, mode, false);
      if (mode.script === "mongol") {
        const sweep = 2400, loop = sweep + 1400;
        drawMongolSweep(ctx, size, text, mode, elapsed === Infinity ? 1 : Math.min(1, (elapsed % loop) / sweep), true);
        return;
      }
      const strokes = traceStrokePixels(ctx, size, text, mode);
      if (!strokes.length) return;
      const perStroke = strokes.length > 4 ? 750 : 1100;
      const loop = strokes.length * perStroke + 1400; // hold the finished glyph before looping
      const progress = elapsed === Infinity ? strokes.length : Math.min(strokes.length, (elapsed % loop) / perStroke);
      drawStrokeDemo(ctx, size, strokes, progress, true);
    };
    const start = performance.now();
    const step = (now) => {
      paint(now - start);
      raf = requestAnimationFrame(step);
    };
    if (playing) raf = requestAnimationFrame(step);
    else {
      // Paused: show the finished guide (again once the web font is in).
      paint(Infinity);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => paint(Infinity));
    }
    return () => cancelAnimationFrame(raf);
  }, [text, mode.key, playing, restart, size]);

  const btn = { borderRadius: 12, padding: "6px 12px", fontWeight: 800, fontSize: 14, color: "#3A2E22", cursor: "pointer", ...depthStyle("#FFFFFF", 3) };

  return (
    <div style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
      <div style={{ fontSize: 14, fontWeight: 800, color: "#3A6B8A" }}>🎬 Заавар видео</div>
      <div
        style={{
          position: "relative",
          width: size,
          height: size,
          borderRadius: 18,
          background: "#FFFDF7",
          border: "3px solid #3A2E22",
          boxShadow: "0 6px 0 rgba(0,0,0,0.1)",
          overflow: "hidden",
        }}
      >
        <canvas ref={canvasRef} width={size * dpr} height={size * dpr} style={{ width: size, height: size, display: "block" }} />
        <div style={{ position: "absolute", top: 6, left: 8, fontSize: 11, fontWeight: 800, color: playing ? "#D9534F" : "#8A7B66" }}>
          {playing ? "● Тоглож байна" : "❚❚ Зогссон"}
        </div>
      </div>
      <div style={{ display: "flex", gap: 6 }}>
        <button className="btn3d" onClick={() => setPlaying(!playing)} style={btn}>
          {playing ? "⏸ Зогсоох" : "▶️ Тоглуулах"}
        </button>
        <button className="btn3d" onClick={() => { setPlaying(true); setRestart(restart + 1); }} style={btn} aria-label="Дахин эхлүүлэх">
          🔁
        </button>
      </div>
    </div>
  );
}

const PEN_COLORS = ["accent", "#E0664F", "#F2A93B", "#3A9E4A", "#3A6BD9", "#9B59B6", "rainbow"];
const STAR_BG = ["#FFFFFF", "#FFF3C4", "#FFE08A", "#FFC93C"];

function TraceScreen({ accent, onCaption }) {
  const [modeKey, setModeKey] = useState("upper");
  const [idx, setIdx] = useState(0);
  const [result, setResult] = useState(null); // { stars } | null
  const [free, setFree] = useState(false); // write without the dashed guide
  const [pen, setPen] = useState(() => loadJSON("tracePen", "accent"));
  const [stars, setStars] = useState(() => loadJSON("traceStars", {})); // { "mode:text": best stars 1-3 }
  const [size] = useState(() => Math.min(320, window.innerWidth - 40));
  const guideRef = useRef(null);
  const demoRef = useRef(null);
  const drawRef = useRef(null);
  const drawingRef = useRef(false);
  const lastRef = useRef(null);
  const animRef = useRef(0);
  const inkRef = useRef([]); // the child's strokes, for the stroke-order check
  const hueRef = useRef(0);
  const dpr = window.devicePixelRatio || 1;
  const mode = TRACE_MODES.find((m) => m.key === modeKey);
  const item = mode.items[idx];
  const starKey = (it) => `${mode.key}:${it.text}`;

  function pixelStrokes() {
    return traceStrokePixels(guideRef.current.getContext("2d"), size, item.text, mode);
  }

  // progress = how many strokes are drawn (fractional part = current stroke).
  function renderDemo(progress) {
    const canvas = demoRef.current;
    if (!canvas || !guideRef.current) return;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    if (free) return;
    if (mode.script === "mongol") drawMongolSweep(ctx, size, item.text, mode, progress >= 1 ? Infinity : progress);
    else drawStrokeDemo(ctx, size, pixelStrokes(), progress);
  }

  function playDemo() {
    cancelAnimationFrame(animRef.current);
    const count = mode.script === "mongol" ? 1 : pixelStrokes().length;
    const perStroke = mode.script === "mongol" ? 2000 : count > 4 ? 600 : 900;
    const start = performance.now();
    const step = (now) => {
      const progress = Math.min(count, (now - start) / perStroke);
      renderDemo(progress);
      if (progress < count) animRef.current = requestAnimationFrame(step);
    };
    animRef.current = requestAnimationFrame(step);
  }

  function finishDemo() {
    cancelAnimationFrame(animRef.current);
    renderDemo(Infinity);
  }

  function showHow() {
    clearDrawing();
    if (free) setFree(false);
    else playDemo();
    onCaption(mode.script === "mongol" ? "Ногоон цэгээс эхлээд дээрээс доош бичээрэй ✏️" : "Ногоон тооноос эхлээд сумны дагуу бичээрэй ✏️");
  }

  useEffect(() => () => cancelAnimationFrame(animRef.current), []);

  function drawGuide() {
    const canvas = guideRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    paintTraceGlyph(ctx, size, item.text, mode, true);
  }

  function clearDrawing() {
    const canvas = drawRef.current;
    if (!canvas) return;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    inkRef.current = [];
    setResult(null);
  }

  // Declared before the per-glyph effect so its finishDemo() on mount runs first
  // and does not cancel the opening demo.
  useEffect(() => { finishDemo(); }, [free]);

  useEffect(() => {
    drawGuide();
    clearDrawing();
    // The web font may still be loading on first open — redraw once it's in.
    // The demo is placed from the glyph's measured box, so start it after that too.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawGuide(); playDemo(); });
    else playDemo();
  }, [modeKey, idx]);

  function point(e) {
    const rect = drawRef.current.getBoundingClientRect();
    return { x: ((e.clientX - rect.left) * size) / rect.width, y: ((e.clientY - rect.top) * size) / rect.height };
  }

  function strokeTo(p) {
    const ctx = drawRef.current.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = size * 0.09;
    if (pen === "rainbow") {
      hueRef.current = (hueRef.current + 4) % 360;
      ctx.strokeStyle = `hsl(${hueRef.current}, 85%, 55%)`;
    } else {
      ctx.strokeStyle = pen === "accent" ? accent : pen;
    }
    ctx.beginPath();
    ctx.moveTo(lastRef.current.x, lastRef.current.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastRef.current = p;
  }

  function onDown(e) {
    e.currentTarget.setPointerCapture(e.pointerId);
    drawingRef.current = true;
    finishDemo();
    lastRef.current = point(e);
    inkRef.current.push([lastRef.current]);
    strokeTo(lastRef.current);
    setResult(null);
  }

  function onMove(e) {
    if (!drawingRef.current) return;
    const p = point(e);
    inkRef.current[inkRef.current.length - 1].push(p);
    strokeTo(p);
  }

  function onUp() {
    drawingRef.current = false;
  }

  // Compare the child's ink with the guide glyph: enough of the glyph must be
  // covered without too much ink spilling outside it, then check stroke order.
  function check() {
    const w = drawRef.current.width;
    const h = drawRef.current.height;
    const guide = guideRef.current.getContext("2d").getImageData(0, 0, w, h).data;
    const ink = drawRef.current.getContext("2d").getImageData(0, 0, w, h).data;
    let guideCount = 0, covered = 0, inkCount = 0, outside = 0;
    for (let i = 3; i < guide.length; i += 16) {
      const inGuide = guide[i] > 100;
      const inked = ink[i] > 0;
      if (inGuide) { guideCount++; if (inked) covered++; }
      if (inked) { inkCount++; if (!inGuide) outside++; }
    }
    const coverage = covered / guideCount;
    // Without the guide the child can't see the outline, so be more forgiving.
    const good = inkCount > 0 && coverage >= (free ? 0.3 : 0.4) && outside / inkCount <= (free ? 0.6 : 0.5);
    if (!good) {
      setResult({ stars: 0 });
      onCaption("Шугамаа дагаад дахин бичээрэй ✏️");
      return;
    }
    const expected = pixelStrokes();
    let order = expected.length ? checkStrokeOrder(expected, inkRef.current, size * 0.16) : { ok: true };
    if (mode.script === "mongol") {
      // The script runs top to bottom: the child's longest stroke must too.
      const main = inkRef.current.reduce((a, s) => (s.length > a.length ? s : a), []);
      if (main.length > 1 && main[main.length - 1].y < main[0].y - size * 0.1) {
        order = { ok: false, hint: "Худам бичгийг дээрээс доош бичдэг. Ногоон цэгээс эхлээрэй" };
      }
    }
    const earned = !order.ok ? 1 : coverage >= (free ? 0.45 : 0.55) ? 3 : 2;
    setResult({ stars: earned });
    setStars((prev) => {
      const key = starKey(item);
      if ((prev[key] || 0) >= earned) return prev;
      const next = { ...prev, [key]: earned };
      saveJSON("traceStars", next);
      return next;
    });
    const message = earned === 3 ? "Гайхалтай бичлээ!" : earned === 2 ? "Сайн байна! Шугамаа бүрэн бүрхээд үзээрэй" : order.hint;
    onCaption(`${message} ${"⭐".repeat(earned)}`);
  }

  function go(step) {
    setIdx((idx + step + mode.items.length) % mode.items.length);
  }

  function switchMode(next) {
    setModeKey(next);
    setIdx(0);
  }

  function pickPen(next) {
    setPen(next);
    saveJSON("tracePen", next);
  }

  const smallBtn = (bg, color) => ({
    borderRadius: 14,
    padding: "10px 14px",
    fontWeight: 800,
    fontSize: 16,
    color,
    cursor: "pointer",
    ...depthStyle(bg, 4),
  });
  const chipBtn = (active) => ({ ...smallBtn(active ? accent : "#FFFFFF", active ? "#FFFFFF" : "#3A2E22"), padding: "7px 11px", fontSize: 14 });
  const mongolText = { fontFamily: "'Noto Sans Mongolian', sans-serif", writingMode: "vertical-lr" };

  const hint = free
    ? "Одоо шугамгүйгээр өөрөө бичээд үзээрэй 💪"
    : mode.script === "mongol"
      ? "Ногоон цэгээс эхлээд тасархай шугамыг дээрээс доош дагаж бичээрэй ✏️"
      : <>Ногоон <b>1</b>-ээс эхлээд сумны дагуу хуруугаараа бичээрэй ✏️</>;

  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 8, marginBottom: 10 }}>
        {TRACE_MODES.map((m) => (
          <button key={m.key} className="btn3d" onClick={() => switchMode(m.key)} style={chipBtn(modeKey === m.key)}>
            {m.label}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", alignItems: "center", gap: 8, marginBottom: 12 }}>
        <button className="btn3d" onClick={() => setFree(false)} style={chipBtn(!free)}>✏️ Шугамтай</button>
        <button className="btn3d" onClick={() => { setFree(true); clearDrawing(); }} style={chipBtn(free)}>🙈 Өөрөө</button>
        <span style={{ width: 8 }} />
        {PEN_COLORS.map((c) => (
          <button
            key={c}
            onClick={() => pickPen(c)}
            aria-label={c === "rainbow" ? "Солонго өнгө" : "Үзгийн өнгө"}
            style={{
              width: 28,
              height: 28,
              borderRadius: "50%",
              cursor: "pointer",
              border: pen === c ? "3px solid #3A2E22" : "3px solid #FFFFFF",
              boxShadow: "0 2px 4px rgba(0,0,0,0.2)",
              background: c === "rainbow" ? "conic-gradient(#E0664F, #F2A93B, #F7E04B, #3A9E4A, #3A6BD9, #9B59B6, #E0664F)" : c === "accent" ? accent : c,
            }}
          />
        ))}
      </div>
      <div style={{ fontSize: 16, fontWeight: 700, color: "#3A6B8A", marginBottom: 10 }}>{hint}</div>
      <div style={{ display: "flex", gap: 18, justifyContent: "center", alignItems: "center", flexWrap: "wrap" }}>
        <TraceVideo text={item.text} mode={mode} size={window.innerWidth >= 600 ? 200 : 150} />
        <div
          style={{
            position: "relative",
            width: size,
            height: size,
            borderRadius: 26,
            background: "#FFFFFF",

const MONGOL_TEXT = { fontFamily: "'Noto Sans Mongolian', sans-serif", writingMode: "vertical-lr" };

// How the current traditional-script letter looks at the start, middle and end
// of a word, and (for consonants) the syllables it makes with each vowel.
function MongolLetterForms({ glyph, name, accent }) {
  const syllables = mongolSyllables(glyph, name);
  const cell = {
    display: "flex",
    flexDirection: "column",
    alignItems: "center",
    gap: 4,

    borderRadius: 14,

  const caption = { fontSize: 12, fontWeight: 800, color: "#8A7A66" };
  return (
    <div style={{ maxWidth: 560, margin: "0 auto 14px" }}>
      <div style={{ fontSize: 14, fontWeight: 800, color: "#3A6B8A", marginBottom: 8 }}>Үгийн хаана орохоос хамаарч хэлбэр нь өөрчлөгдөнө</div>
      <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>

            <div style={caption}>{where}</div>

        ))}
      </div>
      {syllables.length > 0 && (
        <>
          <div style={{ fontSize: 14, fontWeight: 800, color: "#3A6B8A", margin: "14px 0 8px" }}>Үе</div>
          <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>

              <div key={script} style={{ ...cell, padding: "6px 8px" }}>

                <div style={caption}>{cyr}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// Guessing game: a traditional letter or word with Cyrillic choices, or the
// other way round.
function makeScriptRound() {
  const useWord = Math.random() < 0.35;
  const pool = useWord
    ? MONGOL_WORDS.map(([script, cyr, emoji]) => ({ script, cyr, emoji }))
    : MONGOL_LETTERS.filter(([g]) => g !== "ᠩ").map(([script, cyr]) => ({ script, cyr }));
  const item = pool[Math.floor(Math.random() * pool.length)];
  const options = shuffle([item, ...shuffle(pool.filter((p) => p !== item)).slice(0, 2)]);
  return { item, options, toScript: Math.random() < 0.5 };
}

function ScriptGameScreen({ accent, onCaption, onCorrect }) {
  const [round, setRound] = useState(makeScriptRound);
  const [score, setScore] = useState(0);
  const [solved, setSolved] = useState(false);
  const [wrong, setWrong] = useState(null);
  const { item, options, toScript } = round;
  const prompt = toScript ? "Худам бичгээр аль нь вэ? 🎯" : "Энэ юу гэсэн үг вэ? 🎯";

  useEffect(() => { onCaption(prompt); }, [round]);

  function answer(opt) {
    if (solved) return;
    if (opt === item) {
      setSolved(true);
      setScore((s) => s + 1);
      onCorrect(`Зөв байна! ${item.cyr} ${item.emoji || ""}`);
      setTimeout(() => {
        setSolved(false);
        setRound(makeScriptRound());
      }, 1100);
    } else {
      setWrong(opt);
      onCaption("Дахин оролдоорой 💪");
      setTimeout(() => setWrong(null), 500);
    }
  }

  const scriptStyle = (px) => ({ ...MONGOL_TEXT, fontSize: px });
  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ display: "inline-block", background: "#FFFFFF", borderRadius: 16, padding: "6px 16px", fontWeight: 800, fontSize: 16, color: "#3A2E22", marginBottom: 14, boxShadow: "0 3px 0 rgba(0,0,0,0.1)" }}>
        ⭐ {score}
      </div>
      <div style={{ fontSize: 17, fontWeight: 800, color: "#3A6B8A", marginBottom: 12 }}>{prompt}</div>
      <div
        style={{
          display: "inline-flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          minWidth: 150,
          minHeight: 150,
          padding: 16,
          marginBottom: 22,
          borderRadius: 24,
          background: "#FFFFFF",
          boxShadow: solved ? "0 0 0 5px #5FBF6A, 0 6px 0 rgba(0,0,0,0.1)" : "0 6px 0 rgba(0,0,0,0.1)",
          animation: solved ? "celebrate 0.6s ease" : "none",
        }}
      >
        {item.emoji && <div style={{ fontSize: 44, marginBottom: 6 }}>{item.emoji}</div>}
        {toScript ? (
          <div style={{ fontSize: 44, fontWeight: 900, color: "#3A2E22" }}>{item.cyr}</div>
        ) : (
          <div style={{ ...scriptStyle(item.emoji ? 56 : 80), color: "#3A2E22" }}>{item.script}</div>
        )}
      </div>
      <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap", maxWidth: 420, margin: "0 auto" }}>
        {options.map((opt) => (
          <button
            key={opt.script}
            className="tile"
            onClick={() => answer(opt)}
            style={{
              minWidth: 96,
              minHeight: toScript ? 120 : 84,
              padding: "10px 12px",
              borderRadius: 20,
              color: "#FFFFFF",
              fontWeight: 900,
              cursor: "pointer",
              textShadow: "0 2px 0 rgba(0,0,0,0.18)",
              animation: wrong === opt ? "shakeWrong 0.4s ease" : "none",
              ...depthStyle(solved && opt === item ? "#5FBF6A" : wrong === opt ? "#D9534F" : accent, 5),
              ...(toScript ? scriptStyle(opt.emoji ? 34 : 46) : { fontSize: 30 }),
            }}
          >
            {toScript ? opt.script : opt.cyr}
          </button>
        ))}
      </div>
    </div>
  );
}

// Stars earned on the tracing screen, per tracing mode.
function TraceProgressCard({ style }) {
  const stars = loadJSON("traceStars", {});
  const rows = TRACE_MODES.map((m) => {
    const got = m.items.map((it) => ({ it, s: stars[`${m.key}:${it.text}`] || 0 }));
    return {
      mode: m,
      done: got.filter((g) => g.s > 0).length,
      total: m.items.length,
      sum: got.reduce((a, g) => a + g.s, 0),
      weak: got.filter((g) => g.s === 1).map((g) => g.it.text),
    };
  });
  if (!rows.some((r) => r.done)) return null;
  return (
    <div style={style}>
      <div style={{ fontSize: 17, fontWeight: 900, color: "#3A2E22", marginBottom: 6 }}>✏️ Бичих дадлага</div>
      {rows.map((r) => (
        <div key={r.mode.key} style={{ padding: "8px 0", borderTop: "1px solid #F0E8DA" }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, color: "#3A2E22", gap: 10 }}>
            <span>{r.mode.label}</span>
            <span style={{ fontSize: 13, color: "#6B5A45" }}>{r.done}/{r.total} бичсэн · ⭐ {r.sum}/{r.total * 3}</span>
          </div>
          {r.weak.length > 0 && (
            <div style={{ fontSize: 13, fontWeight: 600, color: "#E0664F", marginTop: 2 }}>
              Зурлагын дарааллаа давтах: {r.weak.join(", ")}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

          {r.stat.attempts} удаа · ⭐ {r.stat.best}/{QUIZ_LENGTH} · ❌ {r.stat.mistakes}

  return (

            <div style={{ ...card, borderLeft: "6px solid #E0664F" }}>

function formatClock(totalSec) {
  const sec = Math.max(0, totalSec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

      arr.push({ left: r() * 100, top: r() * 60, size: 1 + r() * 2.2, delay: r() * 2.6, dur: 2 + r() * 2.4 });

    return arr;
  }, [idx]);

  useEffect(() => {
    if (!playing || item.type !== "audio") {
      setNotes([]);
      return;
    }
    const id = setInterval(() => {
      setNotes((prev) => [
        ...prev.slice(-5),

          id: Math.random(),

  const [page, setPage] = useState(() => Math.max(0, entries.findIndex(([k]) => k === activeLullaby)));
  const trackRef = useRef(null);
  const scrollTimeout = useRef(null);

  function goTo(i) {
    setPage(i);
    const el = trackRef.current;
    if (el) el.scrollTo({ left: i * el.clientWidth, behavior: "smooth" });
  }

  function handleScroll() {
    const el = trackRef.current;
    if (!el) return;
    clearTimeout(scrollTimeout.current);
    scrollTimeout.current = setTimeout(() => {
      const i = Math.round(el.scrollLeft / el.clientWidth);
      setPage((p) => (i !== p ? i : p));
    }, 80);
  }

  const [curKey, curItem] = entries[page];
  const curPlaying = isPlaying && activeLullaby === curKey;
  const ringOffset =
    curItem.type === "audio" ? LULLABY_CIRC * (1 - (curPlaying ? playProgress : 0)) : LULLABY_CIRC * 0.25;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 30, background: "#0d0a1a" }}>
      <div
        style={{
          position: "absolute",
          zIndex: 6,
          left: 64,
          right: 14,
          top: "max(14px, env(safe-area-inset-top))",
          display: "flex",
          gap: 6,
        }}
      >
        {entries.map(([k], i) => (
          <button
            key={k}
            onClick={() => goTo(i)}
            aria-label={entries[i][1].label}
            style={{
              flex: 1,
              height: 3,
              border: 0,
              padding: 0,
              borderRadius: 2,
              background: i === page ? "#F3E9C7" : "rgba(243,233,199,0.28)",
              cursor: "pointer",
            }}
          />
        ))}
      </div>

      <button
        onClick={onBack}
        aria-label="Нүүр"
        style={{
          position: "absolute",
          zIndex: 6,
          left: 14,
          top: "calc(max(14px, env(safe-area-inset-top)) - 6px)",
          width: 40,
          height: 40,
          borderRadius: "50%",
          border: "none",
          cursor: "pointer",
          background: "rgba(255,255,255,0.14)",
          color: "#F3E9C7",
          fontSize: 18,
          display: "grid",
          placeItems: "center",
        }}
      >
        🏠
      </button>
      <div
        ref={trackRef}
        className="lullaby-track"
        onScroll={handleScroll}
        style={{
          display: "flex",
          height: "100%",
          width: "100%",
          overflowX: "auto",
          overflowY: "hidden",
          scrollSnapType: "x mandatory",
          overscrollBehaviorX: "contain",
        }}
      >
        {entries.map(([key, item], i) => (
          <LullabyPage key={key} item={item} idx={i} playing={isPlaying && activeLullaby === key} profile={profile} />
        ))}
      </div>

      <div
        style={{
          position: "absolute",
          zIndex: 6,
          left: 14,
          right: 14,
          bottom: "calc(max(22px, env(safe-area-inset-bottom)) + 92px)",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          gap: 8,
        }}
      >
        <div style={{ fontSize: 12, fontWeight: 800, color: "#F3E9C7", opacity: 0.9, fontVariantNumeric: "tabular-nums" }}>
          ⏰ Унтах таймер
          {sleepMinutes && ` — ${formatClock(sleepRemainingSec)} дараа унтрана`}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 8 }}>
          {[60, 120, 180].map((mins) => {
            const isActive = sleepMinutes === mins;
            return (
              <button
                key={mins}
                className="btn3d"
                onClick={() => onSetSleepTimer(isActive ? null : mins)}
                style={{
                  borderRadius: 14,
                  padding: "7px 14px",
                  fontWeight: 800,
                  fontSize: 13,
                  color: isActive ? "#3A2E22" : "#F3E9C7",
                  cursor: "pointer",
                  ...depthStyle(isActive ? "#FFC93C" : "#3A3873", 3),
                }}
              >
                {mins / 60} цаг
              </button>
            );
          })}
          {sleepMinutes && (
            <button
              className="btn3d"
              onClick={() => onSetSleepTimer(null)}
              style={{
                borderRadius: 14,
                padding: "7px 14px",
                fontWeight: 800,
                fontSize: 13,
                color: "#F3E9C7",
                cursor: "pointer",
                ...depthStyle("#2B2A5C", 3),
              }}
            >
              Унтраах
            </button>
          )}
        </div>
      </div>

      <button
        onClick={() => onSelect(curKey)}
        aria-label={curPlaying ? "Зогсоох" : "Тоглуулах"}
        style={{
          position: "absolute",
          zIndex: 6,
          left: "50%",
          bottom: "max(22px, env(safe-area-inset-bottom))",
          transform: "translateX(-50%)",
          width: 76,
          height: 76,
          padding: 0,
          border: 0,
          background: "none",
          cursor: "pointer",
        }}
      >
        <svg
          viewBox="0 0 84 84"
          aria-hidden="true"
          style={{ position: "absolute", inset: 0, width: "100%", height: "100%", transform: "rotate(-90deg)" }}
        >
          <circle cx="42" cy="42" r="39" fill="none" stroke="rgba(246,239,226,0.22)" strokeWidth="2.5" />
          <circle
            cx="42"
            cy="42"
            r="39"
            fill="none"
            stroke="#f6efe2"
            strokeWidth="2.5"
            strokeLinecap="round"
            strokeDasharray={LULLABY_CIRC}
            strokeDashoffset={ringOffset}
            style={{
              transition: curItem.type === "audio" ? "stroke-dashoffset 0.2s linear" : "none",
              animation: curPlaying && curItem.type !== "audio" ? "breathe 2.4s ease-in-out infinite" : "none",
              opacity: curPlaying ? 1 : 0.5,
            }}
          />
        </svg>
        <span
          style={{
            position: "absolute",
            inset: 8,
            borderRadius: "50%",
            background: "linear-gradient(160deg, #f3d38c, #c9974a)",
            color: "#1c1530",
            display: "grid",
            placeItems: "center",
            boxShadow: "0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.5)",
            fontSize: 22,
          }}
        >
          {curPlaying ? "⏸" : "▶"}
        </span>
      </button>

    </div>
  );
}

function Modal({ children, onClose }) {
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(58,46,34,0.45)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 20,
        padding: 20,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "linear-gradient(180deg, #FFFEFA 0%, #FFF8EC 60%)",
          borderRadius: 28,
          padding: "36px 30px",
          textAlign: "center",
          border: "3px solid #FFC93C",
          boxShadow: "0 12px 0 #E4D3B0, 0 20px 40px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(224,100,90,0.22)",
          animation: "popIn 0.3s ease",
          maxWidth: 360,
          width: "100%",
        }}
      >
        {children}
        <div style={{ marginTop: 18, fontSize: 14, fontWeight: 700, color: "#8A7A66" }}>
          Хаахын тулд дарна уу
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
setTimeout(() => {
  const splash = document.getElementById('splash');
  document.getElementById('root').classList.add('ready');
  if (splash) {
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 700);
  }
}, 700);
</script>
<script>
  if ("serviceWorker" in navigator) {
    // Whether this page load was already controlled by a service worker.
    // If so, a later controllerchange means a *new* version just took
    // over — a real update, worth telling the user about. If not (first
    // ever install), skip the toast — nothing was actually "updated".
    const hadController = !!navigator.serviceWorker.controller;
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        reg.update().catch(() => {});
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      if (hadController) {
        try { sessionStorage.setItem("appJustUpdated", "1"); } catch (e) {}
      }
      window.location.reload();
    });
  }
</script>
